<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>{{ page.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- MathJax 設定：インライン数式 $ ... $ を有効化 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
  </script>

  <!-- MathJax 本体 -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
  {{ content }}

  <!-- Creative Commons ライセンス -->
  <footer style="margin-top: 3rem; text-align: center; font-size: 0.9rem; color: #666;">
    この教材は、
    <a href="http://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer">
      クリエイティブ・コモンズ 表示 - 非営利 - 継承 4.0 国際 ライセンス
    </a>
    で提供されます。

    <div style="margin-top: 0.5rem;">
      <img src="https://i.creativecommons.org/l/by-nc-sa/4.0/88x31.png"
          alt="CC BY-NC-SA 4.0"
          style="border: none;">
    </div>
  </footer>
</body>
</html>
